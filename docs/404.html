<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Magician Smart Controller</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/dobot-magician-controller/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--ink:#1b1f24;--muted:#525c6b;--line:#e1e4ea;--accent:#2563eb;--on-accent:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#e6e8ec;--muted:#a3acba;--line:#2a2f3a;--accent:#60a5fa;--on-accent:#0b1220}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:24px 16px}
main{max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center}
h1{margin:0 0 8px;font-size:1.8rem;line-height:1.2}
p{margin:0 0 22px;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;border-radius:10px;border:1px solid var(--line);color:var(--ink);font-weight:650;text-decoration:none}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page doesn't exist. The Magician Smart Controller app and its home page are here:</p>
  <div class="cta">
    <a class="btn primary" href="/dobot-magician-controller/app/">Open the app</a>
    <a class="btn" href="/dobot-magician-controller/">Home page</a>
  </div>
</main>
</body>
</html>
